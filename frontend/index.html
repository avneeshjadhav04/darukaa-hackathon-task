<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Environmental Scientist — Darukaa.Earth</title>
    <style>
      /* splash preloader — inline so it paints before the JS bundle loads */
      #splash {
        position: fixed; inset: 0; z-index: 9999; background: #ffffff;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; font-family: Inter, system-ui, -apple-system, sans-serif;
        transition: opacity .3s ease; pointer-events: all;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .splash-row { display: flex; align-items: center; gap: 10px; }
      #splash .splash-leaf { color: #0a7d42; display: grid; place-items: center; }
      #splash .splash-title {
        font-size: 19px; font-weight: 700; letter-spacing: -0.01em; color: #111111;
      }
      #splash .splash-loading {
        display: flex; align-items: center; gap: 8px;
        font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
        color: #8a8a82; font-weight: 600;
      }
      #splash .splash-dots { display: inline-flex; gap: 5px; }
      #splash .splash-dots i {
        width: 6px; height: 6px; border-radius: 50%; background: #8a8a82;
        animation: splash-blink 1.2s infinite;
      }
      #splash .splash-dots i:nth-child(2) { animation-delay: .15s; }
      #splash .splash-dots i:nth-child(3) { animation-delay: .3s; }
      @keyframes splash-blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
      @media (max-width: 380px) {
        #splash .splash-title { font-size: 16px; }
        #splash .splash-leaf svg { width: 17px; height: 17px; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-row">
        <span class="splash-title">Biodiversity Intelligence</span>
        <span class="splash-leaf">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
          </svg>
        </span>
      </div>
      <div class="splash-loading">
        <span>loading</span>
        <span class="splash-dots"><i></i><i></i><i></i></span>
      </div>
    </div>
    <script>window.__splashShownAt = performance.now();</script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
