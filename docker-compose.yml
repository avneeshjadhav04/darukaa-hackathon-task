# Convenience only — the single Dockerfile is sufficient on its own.
# State is container-local (/app/data); it resets on redeploy/restart by design.
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Optional fallback secrets/config (UI-configured keys take precedence)
      - LLM_PROVIDER_NAME=${LLM_PROVIDER_NAME:-}
      - LLM_PROVIDER_BASE_URL=${LLM_PROVIDER_BASE_URL:-}
      - LLM_PROVIDER_MODEL_NAME=${LLM_PROVIDER_MODEL_NAME:-}
      - LLM_PROVIDER_API_KEY=${LLM_PROVIDER_API_KEY:-}
      - EMBEDDING_PROVIDER_NAME=${EMBEDDING_PROVIDER_NAME:-}
      - EMBEDDING_PROVIDER_BASE_URL=${EMBEDDING_PROVIDER_BASE_URL:-}
      - EMBEDDING_PROVIDER_MODEL_NAME=${EMBEDDING_PROVIDER_MODEL_NAME:-}
      - EMBEDDING_PROVIDER_API_KEY=${EMBEDDING_PROVIDER_API_KEY:-}
    restart: unless-stopped
